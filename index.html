    </div>
    <div class="card" id="runGold" aria-label="이번 판에 모은 골드">
      <div class="label">골드</div>
      <div class="score"><i class="coin"></i><span id="runGoldVal">0</span></div>
      <div class="small">보유 <span id="holdGold">0</span></div>
    </div>
  </div>
  <div class="mid">
    <button class="icon" id="gameMenu" aria-label="설정"></button>
  </div>
</div>
<div class="card" id="next">
  <div class="label">다음</div>
  <img id="nextImg" alt="">
  <div class="small" id="nextName"></div>
</div>

<div class="card" id="hint"></div>
<div id="gauge" aria-hidden="true">
  <span>높이</span>
  <div id="gaugeTrack"><div id="gaugeFill"></div><i id="gaugeBox"></i></div>
</div>
<div id="chain">
  <div id="chainList"></div>
  <button class="icon" id="chainToggle" aria-label="과일 순서 접기" aria-expanded="true"></button>
</div>
<div id="joy" role="slider" aria-label="끌어서 시점 돌리기">
  <svg class="arrows" viewBox="0 0 92 92" aria-hidden="true">
    <path d="M46 7l6 7H40z"/><path d="M46 85l6-7H40z"/><path d="M7 46l7-6v12z"/><path d="M85 46l-7-6v12z"/>
  </svg>
  <div id="joyKnob"></div>
  <span id="joyLabel">시점 돌리기</span>
</div>
<div id="menu" hidden>
  <div class="page" id="menuMain">
    <div id="menuTop">
      <button id="mSettings" aria-label="설정"></button>
      <div id="menuGold" class="gold-pill" aria-label="보유 골드"><i class="coin"></i><span id="goldVal">0</span></div>
    </div>
    <h1 class="logo">수박 만들기 <em>3D</em></h1>
    <div id="menuHero"><div id="menuLogoWrap"><img id="menuLogo" alt="수박" draggable="false"></div></div>
    <div id="setStrip" role="radiogroup" aria-label="테마 고르기"></div>
    <div id="menuBest"></div>
    <div class="menu-buttons">
      <button class="menu-play" id="mPlay">플레이</button>
      <div class="menu-row">
        <button class="menu-tile" id="mShop">상점<i class="dot" id="shopDot" hidden></i></button>
        <button class="menu-tile" id="mRank">순위</button>
        <button class="menu-tile" id="mStats">통계</button>
      </div>
    </div>
  </div>
  <div class="page" id="menuShop" hidden>
    <div class="page-head"><button id="shBack" aria-label="뒤로"></button><h2>상점</h2><div class="gold-pill" aria-label="보유 골드"><i class="coin"></i><span id="shGold">0</span></div></div>
    <div class="seg shop-tabs" id="shTabs" role="radiogroup" aria-label="상점 종류"></div>
    <div class="set-list" id="shopList"></div>
  </div>
  <div class="page" id="menuStats" hidden>
    <div class="page-head"><button id="tBack" aria-label="뒤로"></button><h2>통계</h2></div>
    <div class="set-list" id="statList"></div>
  </div>
  <div class="page" id="menuSettings" hidden>
    <div class="page-head"><button id="sBack" aria-label="뒤로"></button><h2>설정</h2></div>
    <div class="set-list">
      <div class="set-row"><span>소리</span><button class="switch" id="sSound" role="switch" aria-label="소리"></button></div>
      <div class="set-row"><span>진동</span><button class="switch" id="sHaptic" role="switch" aria-label="진동"></button></div>
      <div class="set-row"><span>떨어뜨릴 과일 테두리</span><button class="switch" id="sOutline" role="switch" aria-label="떨어뜨릴 과일 테두리"></button></div>
      <div class="set-row"><span>조이스틱 위치</span><div class="seg" id="sJoy" role="radiogroup" aria-label="조이스틱 위치"></div></div>
      <button class="set-row" id="sTutorial"><span>게임 방법 다시 보기</span><span aria-hidden="true">›</span></button>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>
<div id="vignette"></div>
<div id="warn" role="alert">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
  선을 넘었어요 <b id="warnSec">5</b>
</div>

<div id="photo" hidden>
  <div id="photoCard" aria-hidden="true"><b>수박 만들기 3D</b><strong id="photoScore">0</strong><span id="photoBest"></span><small id="photoDate"></small></div>
  <div class="card" id="photoHint">끌어서 돌리고, 두 손가락으로 확대해요</div>
  <div id="photoBar"><button id="photoCancel">취소</button><button id="photoShutter" aria-label="찍기"></button></div>
</div>
<div id="photoFlash"></div>
<div id="modal" role="dialog" aria-modal="true">
  <div class="card">
    <h2></h2>
    <div class="body"></div>
    <div class="buttons"></div>
  </div>
</div>

</body>
</html>
