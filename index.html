  // WebGL 컨텍스트를 게임 코드(약 1MB)를 받아 해석하는 동안 미리 만든다. 컨텍스트 만들기는 느린 기기에서 0.1초 넘게 걸리고 그동안 화면이 멈추는데,
  // 게임 코드가 도착한 뒤에 만들면 그 시간이 고스란히 첫 화면에 더해진다. 로딩 화면이 한 번 그려진 뒤에 만들어 로딩 화면이 늦게 뜨지 않게 한다.
  // 설정은 three.js 가 직접 만들 때와 같다 (src/main.js 의 WebGLRenderer). 게임 코드가 먼저 실행되면 거기서 __glMake 를 불러 바로 만든다
  (function () {
    var done = false;
    window.__glMake = function () {
      if (done) return window.__gl;
      done = true;
      try {
        window.__gl = document.getElementById('c').getContext('webgl2', { alpha: true, depth: true, stencil: false, antialias: true, premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 'default', failIfMajorPerformanceCaveat: false });
      } catch (e) { window.__gl = null; }
      return window.__gl;
    };
    requestAnimationFrame(function () { setTimeout(window.__glMake, 0); });
  })();
</script>
</body>
